name: Alignment benchmark

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential clang cmake libclang-dev pkg-config
      - name: Compare exact edit scores
        shell: bash
        run: |
          rustc -Vv
          c++ --version
          cmake --version
          lscpu
          sh tools/align-bench/run.sh | tee -a "$GITHUB_STEP_SUMMARY"
